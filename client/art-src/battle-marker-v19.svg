<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Active space battle</title>
  <desc id="desc">One spacecraft fires a bright cyan-green laser into the side of a subtly red-tinted second spacecraft turned ninety degrees. An amber flash and sparks sit ahead of the target, leaving its hull visible. Selection brackets are drawn separately by the game.</desc>
  <defs>
    <g id="warship">
      <path d="M0-12 3-5 3-1 8 5 8 10 3 7 0 10-3 7-8 10-8 5-3-1-3-5Z" fill="currentColor" stroke="#091321" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0-6 1.6-1 0 2-1.6-1Z" fill="#52667c"/>
      <path d="M-4 5-4 7M4 5 4 7" fill="none" stroke="#91a6b9" stroke-width="1.4"/>
    </g>
  </defs>
  <!-- A quiet plate gives this site marker a footprint without looking selected. -->
  <path d="M18 4H46L60 18V46L46 60H18L4 46V18Z" fill="#0b1522" fill-opacity=".94" stroke="#3d4c5d" stroke-width="1.2"/>
  <!-- One continuous beam; the target hull occludes its end at the broadside. -->
  <g fill="none" stroke-linecap="round">
    <path d="M27 27 43 43" stroke="#42ead9" stroke-width="3.2"/>
    <path d="M27 27 43 43" stroke="#effffa" stroke-width="1.25"/>
  </g>
  <!-- The attacker holds its heading; the target rotates clockwise by 90 degrees. -->
  <use href="#warship" transform="translate(20 20) rotate(135) scale(.82)" color="#e7edf1"/>
  <use href="#warship" transform="translate(44 44) rotate(45) scale(.82)" color="#e5b9b5"/>
  <!-- A local hit, not a destroyed ship: preserve the target's readable silhouette. -->
  <g id="impact" transform="translate(32.5 32.5)">
    <g transform="scale(3.2)">
      <path d="M0-3.5 .7-1 3.5-.75 1.2.7 3.1 2.4-.3 1.4-3.125 2.5-1.2.2-2.625-1.75-.6-.9Z" fill="#ffb752"/>
      <circle r=".75" fill="#fff4d4"/>
    </g>
    <path d="M2.6-3.2 3.5-4.6M-3.1 2.7-4.5 3.8M-3.6-.2-5-.4" fill="none" stroke="#ffc96b" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
