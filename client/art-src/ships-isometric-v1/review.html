<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Syndicates · isometric ship review</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #081322; color: #e6eff7; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 1520px; padding: 32px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.5rem); letter-spacing: .02em; }
  p { color: #9db5c6; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; margin-top: 28px; }
  article { border: 1px solid #314d60; border-radius: 12px; overflow: hidden; background: linear-gradient(145deg, #10273a, #0b1728); }
  h2 { font-size: 1.1rem; margin: 18px 20px 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  figure { margin: 0; min-width: 0; }
  .art { display: grid; place-items: center; aspect-ratio: 1; border-radius: 8px; background: radial-gradient(circle, #1e3546, #08111f 72%); }
  img { width: 100%; height: 100%; object-fit: contain; }
  figcaption { padding: 8px 3px 3px; color: #a9c4d2; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; }
  @media (max-width: 460px) { body { padding: 18px; } .grid { grid-template-columns: 1fr; } }
</style>
