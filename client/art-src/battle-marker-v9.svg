<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Active space battle</title>
  <desc id="desc">Two opposing spacecraft exchange amber laser volleys. A small white collision marks their engagement. Selection brackets are drawn separately by the game.</desc>
  <defs>
    <g id="warship">
      <path d="M0-12 3-5 3-1 8 5 8 10 3 7 0 10-3 7-8 10-8 5-3-1-3-5Z" fill="#e7edf1" stroke="#091321" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0-6 1.6-1 0 2-1.6-1Z" fill="#52667c"/>
      <path d="M-4 5-4 7M4 5 4 7" fill="none" stroke="#91a6b9" stroke-width="1.4"/>
    </g>
  </defs>
  <!-- A quiet plate gives this site marker a footprint without looking selected. -->
  <path d="M18 4H46L60 18V46L46 60H18L4 46V18Z" fill="#0b1522" fill-opacity=".94" stroke="#3d4c5d" stroke-width="1.2"/>
  <!-- Opposed silhouettes; neither side claims the viewer's ownership color. -->
  <use href="#warship" transform="translate(20 20) rotate(135) scale(.82)"/>
  <use href="#warship" transform="translate(44 44) rotate(-45) scale(.82)"/>
  <!-- Short segmented volleys read as an exchange of fire, not an impact cloud. -->
  <g fill="none" stroke-linecap="square">
    <path d="M27 24 30 27M34 31 40 37M24 27 27 30M31 34 37 40" stroke="#ffbe55" stroke-width="2.4"/>
    <path d="M21 40 25 36M29 32 31 30M43 24 39 28M35 32 33 34" stroke="#eb8738" stroke-width="2.4"/>
  </g>
  <!-- Compact clash; most of the visual weight stays on ships and weapons fire. -->
  <path d="M32 27 33.5 30.5 37 32 33.5 33.5 32 37 30.5 33.5 27 32 30.5 30.5Z" fill="#fff0ce" stroke="#0b1522" stroke-width="1" stroke-linejoin="round"/>
</svg>
